info:
  name: Get pemasok-produk-kasir
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/v1/pos/produk/SKU-004/pemasok
  headers:
    - name: x-api-key
      value: kasir-dev-001
    - name: ""
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Header permintaan ini SENGAJA memakai {{kunci_kasir}}, bukan supervisor.
        test('AB-13 kasir ditolak', function () {
        expect(res.status).to.equal(403);
        expect(res.body.kesalahan).to.equal('peran_tidak_berwenang');
        });

        test('Harga beli tidak ikut terkirim pada response penolakan', function () {
        expect(JSON.stringify(res.body)).to.not.include('harga_beli');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
